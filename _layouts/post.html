---
layout: default
---

{%-include back_link.html-%}

<article>
  <p class="post-meta">
    <time datetime="{{ page.date }}">{{ page.date | date: site.theme_config.date_format }}</time>
    {%- if page.categories %}
      {%- for category in page.categories %} | <a href="/categories.html#{{ category | slugify }}" class="post-category">{{ category }}</a>{%- endfor %}
    {%- elsif page.category %} | <a href="/categories.html#{{ page.category | slugify }}" class="post-category">{{ page.category }}</a>
    {%- endif %}
  </p>
  
  <h1>{{ page.title }}</h1>

  {{ content }}
</article>
