<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">OAuth 2.0 授权码模式时序图</title>
  <desc id="desc">用户、客户端、授权服务器和资源服务器之间的授权码模式交互时序。</desc>
  <defs>
    <style>
      .bg { fill: #faf8f2; }
      .frame { fill: #fffefb; stroke: #d9d3c7; stroke-width: 1.5; rx: 20; ry: 20; }
      .actor { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .lane { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 10; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .back { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowBack); stroke-dasharray: 8 6; }
      .title { fill: #0f172a; font: 700 30px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .label { fill: #0f172a; font: 600 22px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .text { fill: #1f2937; font: 20px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .small { fill: #475569; font: 18px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .badge { fill: #e2e8f0; }
      .divider { stroke: #e5e7eb; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <rect x="40" y="40" width="1200" height="680" class="frame" />
  <text x="70" y="88" class="title">OAuth 2.0 授权码模式时序图</text>
  <text x="70" y="120" class="small">重点观察授权码返回点、令牌交换点，以及 API 调用发生的位置。</text>

  <rect x="80" y="150" width="180" height="56" class="actor" />
  <rect x="340" y="150" width="180" height="56" class="actor" />
  <rect x="620" y="150" width="220" height="56" class="actor" />
  <rect x="960" y="150" width="180" height="56" class="actor" />

  <text x="145" y="186" class="label">用户</text>
  <text x="393" y="186" class="label">客户端</text>
  <text x="682" y="186" class="label">授权服务器</text>
  <text x="997" y="186" class="label">资源服务器</text>

  <line x1="170" y1="206" x2="170" y2="660" class="lane" />
  <line x1="430" y1="206" x2="430" y2="660" class="lane" />
  <line x1="730" y1="206" x2="730" y2="660" class="lane" />
  <line x1="1050" y1="206" x2="1050" y2="660" class="lane" />

  <circle cx="92" cy="260" r="16" class="badge" />
  <text x="87" y="266" class="small">1</text>
  <path d="M170 260 L430 260" class="arrow" />
  <text x="225" y="248" class="text">用户点击登录</text>

  <circle cx="92" cy="330" r="16" class="badge" />
  <text x="87" y="336" class="small">2</text>
  <path d="M430 330 L730 330" class="arrow" />
  <text x="500" y="318" class="text">重定向到授权端</text>

  <circle cx="92" cy="400" r="16" class="badge" />
  <text x="87" y="406" class="small">3</text>
  <path d="M730 400 L170 400" class="back" />
  <text x="360" y="388" class="text">用户完成登录并确认授权</text>

  <circle cx="92" cy="470" r="16" class="badge" />
  <text x="87" y="476" class="small">4</text>
  <path d="M730 470 L430 470" class="back" />
  <text x="520" y="458" class="text">返回授权码 code</text>

  <circle cx="92" cy="540" r="16" class="badge" />
  <text x="87" y="546" class="small">5</text>
  <path d="M430 540 L730 540" class="arrow" />
  <text x="490" y="528" class="text">客户端用 code 换 Access Token</text>

  <circle cx="92" cy="610" r="16" class="badge" />
  <text x="87" y="616" class="small">6</text>
  <path d="M430 610 L1050 610" class="arrow" />
  <text x="630" y="598" class="text">带 Bearer Token 调用 API</text>

  <line x1="70" y1="640" x2="1210" y2="640" class="divider" />
  <text x="90" y="685" class="small">说明：授权码是中间凭证；真正的访问凭证由授权服务器签发，资源服务器只消费 Access Token。</text>
</svg>