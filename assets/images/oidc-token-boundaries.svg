<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">OIDC 登录时序图</title>
  <desc id="desc">展示 OIDC 登录后，客户端如何接收 ID Token 与 Access Token，以及 Access Token 如何用于 API 调用。</desc>
  <defs>
    <style>
      .bg { fill: #faf8f2; }
      .frame { fill: #fffefb; stroke: #d9d3c7; stroke-width: 1.5; rx: 20; ry: 20; }
      .actor { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .lane { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 10; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .back { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowBack); stroke-dasharray: 8 6; }
      .title { fill: #0f172a; font: 700 30px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .label { fill: #0f172a; font: 600 22px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .text { fill: #1f2937; font: 20px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .small { fill: #475569; font: 18px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="bg" width="1280" height="760" />
  <rect x="40" y="40" width="1200" height="680" class="frame" />
  <text x="70" y="88" class="title">OIDC 登录时序图</text>
  <text x="70" y="120" class="small">ID Token 给客户端建立登录态，Access Token 给资源服务器做 API 授权。</text>

  <rect x="90" y="150" width="180" height="56" class="actor" />
  <rect x="350" y="150" width="180" height="56" class="actor" />
  <rect x="620" y="150" width="240" height="56" class="actor" />
  <rect x="980" y="150" width="190" height="56" class="actor" />
  <text x="155" y="186" class="label">用户</text>
  <text x="403" y="186" class="label">客户端</text>
  <text x="688" y="186" class="label">OIDC 提供方</text>
  <text x="1018" y="186" class="label">资源服务器</text>
  <line x1="180" y1="206" x2="180" y2="640" class="lane" />
  <line x1="440" y1="206" x2="440" y2="640" class="lane" />
  <line x1="740" y1="206" x2="740" y2="640" class="lane" />
  <line x1="1075" y1="206" x2="1075" y2="640" class="lane" />

  <path d="M180 260 L440 260" class="arrow" />
  <text x="228" y="248" class="text">发起登录</text>
  <path d="M440 330 L740 330" class="arrow" />
  <text x="500" y="318" class="text">跳转到 OIDC Provider</text>
  <path d="M740 400 L440 400" class="back" />
  <text x="500" y="388" class="text">返回 ID Token + Access Token</text>
  <path d="M440 470 L1075 470" class="arrow" />
  <text x="615" y="458" class="text">客户端用 Access Token 调 API</text>
  <path d="M440 540 L440 610" class="back" />
  <text x="462" y="582" class="small">客户端用 ID Token 建立本地登录状态</text>

  <text x="90" y="685" class="small">关键点：ID Token 面向客户端，Access Token 面向资源服务器，二者用途不同。</text>
</svg>