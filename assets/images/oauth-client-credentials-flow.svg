<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">客户端凭证模式时序图</title>
  <desc id="desc">服务调用服务场景下，客户端凭证模式的简化时序图。</desc>
  <defs>
    <style>
      .bg { fill: #faf8f2; }
      .frame { fill: #fffefb; stroke: #d9d3c7; stroke-width: 1.5; rx: 20; ry: 20; }
      .actor { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .lane { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 10; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .back { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowBack); stroke-dasharray: 8 6; }
      .title { fill: #0f172a; font: 700 30px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .label { fill: #0f172a; font: 600 22px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .text { fill: #1f2937; font: 20px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .small { fill: #475569; font: 18px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="bg" width="1280" height="700" />
  <rect x="40" y="40" width="1200" height="620" class="frame" />
  <text x="70" y="88" class="title">客户端凭证模式时序图</text>
  <text x="70" y="120" class="small">这一模式没有用户参与，令牌代表客户端自身。</text>

  <rect x="130" y="160" width="220" height="56" class="actor" />
  <rect x="525" y="160" width="220" height="56" class="actor" />
  <rect x="930" y="160" width="220" height="56" class="actor" />
  <text x="192" y="196" class="label">调用方服务</text>
  <text x="585" y="196" class="label">授权服务器</text>
  <text x="988" y="196" class="label">资源服务器</text>
  <line x1="240" y1="216" x2="240" y2="560" class="lane" />
  <line x1="635" y1="216" x2="635" y2="560" class="lane" />
  <line x1="1040" y1="216" x2="1040" y2="560" class="lane" />

  <path d="M240 290 L635 290" class="arrow" />
  <text x="305" y="278" class="text">用 client_id / client_secret 申请令牌</text>
  <path d="M635 360 L240 360" class="back" />
  <text x="360" y="384" class="small">返回 Access Token</text>
  <path d="M240 450 L1040 450" class="arrow" />
  <text x="525" y="438" class="text">带 Bearer Token 访问 API</text>

  <text x="90" y="610" class="small">说明：客户端凭证模式表达的是服务身份，通常不涉及用户上下文，也通常不返回 Refresh Token。</text>
</svg>